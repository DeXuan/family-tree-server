name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (privacy / crypto / GEDCOM / backup format)
        run: npm run test:unit

      - name: Start server (PGlite, auto-seed)
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=ci-only-secret-0123456789abcdef/" .env
          npm start > server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/healthz > /dev/null; then
              echo "server ready"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:3000/api/healthz

      - name: API + backup/restore end-to-end
        run: npm run test:api

      - name: Concurrency consistency (optimistic lock / unique constraints)
        run: npm run test:concurrency

      - name: Install Playwright (browser UI regression)
        run: npx playwright install --with-deps chromium

      - name: Browser UI end-to-end
        run: node scripts/ui-test.mjs
        env:
          UI_TEST_CHANNEL: chromium

      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: server-log
          path: server.log
          retention-days: 7
